# HomeBox stores only client-encrypted ciphertext. Do not enable server-side decryption.
server:
  host: "0.0.0.0"
  port: 8787
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

storage:
  path: "./data"
  ciphertext_only: true

limits:
  max_users: 5
  max_plaintext_file_size_bytes: 104857600
  upload_chunk_plaintext_size_bytes: 4194304
  max_ciphertext_file_size_bytes: 104859000

security:
  application_encryption:
    enabled: true
    required_for_http: true
    protocol: "noise-nk-25519-chachapoly-sha256"
    session_max_age: "60m"
  e2ee:
    # File framing is fixed by protocol v1: XChaCha20-Poly1305, 4 MB plaintext chunks.
    # The server stores only authenticated key envelopes and never unwraps client keys.
    # Filenames, MIME types, plaintext hashes, conflict details, and labels stay encrypted.
    required: true
    server_decryption_enabled: false
    protocol_version: 1

uploads:
  abandoned_after_hours: 24
