services:
  volume-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /var/lib/homebox"]
    volumes:
      - homebox-data:/var/lib/homebox
    restart: "no"

  homebox:
    build:
      context: .
      dockerfile: Dockerfile
    image: homebox/server:local
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["server", "--config", "/etc/homebox/homebox.yaml"]
    ports:
      - "${HOMEBOX_BIND_ADDRESS:-0.0.0.0}:8787:8787"
    volumes:
      - homebox-data:/var/lib/homebox
      - ./docker/homebox.yaml:/etc/homebox/homebox.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  homebox-data:
