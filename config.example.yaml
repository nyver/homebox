# HomeBox stores only client-encrypted ciphertext. Do not enable server-side decryption.
server:
  host: "0.0.0.0"
  port: 8787
  tls:
    # false (default): the server terminates TLS itself using a self-signed
    # certificate derived from its identity key (keys/server_identity.key).
    # There is no plaintext mode. Clients must trust this connection by
    # pinning the fingerprint printed by `homebox server fingerprint`
    # (ADR-008/ADR-009), not by installing a certificate authority.
    # true: use an operator-supplied certificate/key instead (e.g. a direct
    # Let's Encrypt certificate without a reverse proxy in front).
    enabled: false
    cert_file: ""
    key_file: ""

storage:
  path: "./data"
  ciphertext_only: true

limits:
  max_users: 5
  max_plaintext_file_size_bytes: 104857600
  upload_chunk_plaintext_size_bytes: 4194304
  max_ciphertext_file_size_bytes: 104859000

security:
  application_encryption:
    enabled: true
    required_for_http: true
    # Secure Transport is TLS 1.3 with fingerprint pinning (ADR-008), not a
    # Noise handshake: no comparably mature Dart/Flutter Noise library
    # exists, and the specification's own fallback rule (spec §15.2.5)
    # prefers each platform's standard TLS stack over an unvetted one.
    protocol: "tls1.3-ecdsa-p256-cert-pinning"
    # Access-token lifetime. A session older than this must present its
    # refresh token to get a new access token.
    session_max_age: "15m"
  e2ee:
    # File framing is fixed by protocol v1: XChaCha20-Poly1305, 4 MB plaintext chunks.
    # The server stores only authenticated key envelopes and never unwraps client keys.
    # Filenames, MIME types, plaintext hashes, conflict details, and labels stay encrypted.
    # Recovery Secrets exist only on clients; server backups contain encrypted recovery packages.
    # Windows device private keys remain in OS secure storage; only public keys and recipient envelopes reach the server.
    required: true
    server_decryption_enabled: false
    protocol_version: 1

uploads:
  abandoned_after_hours: 24

sync:
  # Default and maximum number of changes returned per GET /api/v1/sync/changes page.
  page_size: 500
  max_page_size: 2000
