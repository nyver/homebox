# HomeBox stores only client-encrypted ciphertext. Do not enable server-side decryption.
# Android release signing is local to build-mobile-release.bat and is never configured here.
# Desktop Resync uses the authenticated node/upload APIs and needs no server-side option.
server:
  host: "0.0.0.0"
  port: 8787
  # Bounds headers and request bodies, including each resumable upload chunk.
  # Keep this long enough for a 4 MiB chunk over the slowest supported link.
  read_timeout: "2m"
  tls:
    # false (default): the server terminates TLS itself using a self-signed
    # certificate derived from its identity key (keys/server_identity.key).
    # There is no plaintext mode. Clients must trust this connection by
    # pinning the fingerprint printed by `homebox server fingerprint`
    # (ADR-008/ADR-009), not by installing a certificate authority.
    # true: use an operator-supplied certificate/key instead (e.g. a direct
    # Let's Encrypt certificate without a reverse proxy in front).
    enabled: false
    cert_file: ""
    key_file: ""

storage:
  path: "./data"
  # Keep backup directories outside this path. `homebox backup` refuses a
  # destination below storage.path to prevent recursive/self-including backups.
  ciphertext_only: true

limits:
  # `homebox create-user` can create up to this number of separate family accounts.
  # Family Vault grants remain client-encrypted device envelopes; this server
  # setting never enables decryption or server-side key recovery.
  max_users: 5
  # 500 MiB plaintext. The ciphertext cap includes the 16-byte AEAD tag on
  # each 4 MiB chunk (125 tags at the configured maximum file size).
  max_plaintext_file_size_bytes: 524288000
  upload_chunk_plaintext_size_bytes: 4194304
  max_ciphertext_file_size_bytes: 524290000

security:
  application_encryption:
    enabled: true
    required_for_http: true
    # Secure Transport is TLS 1.3 with fingerprint pinning (ADR-008), not a
    # Noise handshake: no comparably mature Dart/Flutter Noise library
    # exists, and the specification's own fallback rule (spec §15.2.5)
    # prefers each platform's standard TLS stack over an unvetted one.
    protocol: "tls1.3-ecdsa-p256-cert-pinning"
    # Access-token lifetime. A session older than this must present its
    # refresh token to get a new access token. Flutter clients renew their
    # access token in the background shortly before this elapses, so an
    # idle client stays authenticated without the user noticing.
    session_max_age: "15m"
  e2ee:
    # File framing is fixed by protocol v1: XChaCha20-Poly1305, 4 MB plaintext chunks.
    # The server stores only authenticated key envelopes and never unwraps client keys.
    # Filenames, MIME types, plaintext hashes, conflict details, and labels stay encrypted.
    # For Android sync-folder opens, clients can derive a MIME type locally
    # from a filename when older encrypted metadata has only a generic type.
    # Recovery Secrets exist only on clients; server backups contain encrypted recovery packages.
    # Device private keys remain in OS secure storage; only public keys and recipient envelopes reach the server.
    # Android camera photos use the same client-only encrypted upload path; the
    # app requests CAMERA at capture time, never broad gallery storage access.
    # Android app-lock biometrics are device-local (`USE_BIOMETRIC`) and do
    # not add a server-side setting or send biometric data to HomeBox.
    # Family Vault envelopes stay opaque ciphertext; per-folder keys are bound to the recipient device only in clients.
    # Android's Share action decrypts only to the client's private temporary
    # cache and grants the receiving app read access; this server never sees
    # the plaintext or participates in that transfer.
    required: true
    server_decryption_enabled: false
    protocol_version: 1

uploads:
  abandoned_after_hours: 24

sync:
  # Windows clients can start an immediate local reconciliation from a native
  # filesystem event and pause new passes without cancelling in-flight writes;
  # notification-area show/hide and opt-in Windows autostart are client-local.
  # this server feed remains the authoritative remote source.
  # Default and maximum number of changes returned per GET /api/v1/sync/changes page.
  page_size: 500
  max_page_size: 2000

maintenance:
  # A blob must remain unreachable for this entire period before a second
  # maintenance pass can remove it. This protects against transient divergence.
  orphan_blob_grace_hours: 168
